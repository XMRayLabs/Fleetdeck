limit_req_zone $binary_remote_addr zone=fleetdeck_api:10m rate=30r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 200m;
    client_body_timeout 30s;
    send_timeout 60s;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss: https://api.github.com https://hcaptcha.com https://*.hcaptcha.com https://www.google.com https://www.gstatic.com; img-src 'self' data: blob: https://*.hcaptcha.com https://www.gstatic.com; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://js.hcaptcha.com https://hcaptcha.com https://*.hcaptcha.com https://www.google.com https://www.gstatic.com; worker-src 'self' blob:; frame-src https://hcaptcha.com https://*.hcaptcha.com https://www.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Unhashed entrypoints must revalidate after deployments. Exact locations
    # also keep these scripts out of the immutable static-asset rule below.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /monaco-environment.js {
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        limit_req zone=fleetdeck_api burst=60 nodelay;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    location ~ /\. {
        deny all;
    }
}
